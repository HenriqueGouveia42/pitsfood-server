version: '3.8'

services:
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run start"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${NEON_DATABASE_URL_POOLED}?pgbouncer=true
      - DATABASE_URL_UNPOOLED=${NEON_DATABASE_URL_DIRECT}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${NEON_DATABASE_URL_POOLED}?pgbouncer=true
      - DATABASE_URL_UNPOOLED=${NEON_DATABASE_URL_DIRECT}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: